# superkit repack configuration for SM-A137F A137FXXSCEZB1
# With the debloat in mods.toml (~1.3 GiB freed) every partition fits as read-write.
# If the capacity table in `superkit repack` says otherwise, add e.g.
#   [partition.product]
#   ro = true
[defaults]
ro = false              # no f2fs `ro` feature, no LP readonly attribute
slack_percent = 3       # headroom on top of the estimated rw image size
slack_min = "8M"
fixed_timestamp = true  # sload -T <stock timestamp>, reproducible images
keep_stock_size = true  # rw images keep the stock size; false = shrink to content + overprovision (frees super space)

# vendor is the partition most likely to receive extra files (modules, firmware, hals):
# give it real headroom. 3 % left only 22 MiB free on the first build.
[partition.vendor]
slack_percent = 30
slack_min = "64M"
