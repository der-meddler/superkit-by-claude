# superkit mods for SM-A137F A137FXXSCEZB1 (see docs/DESIGN.md §4 and superkit/mods/__init__.py)
# Paths are <partition>/<path inside that partition's root>; for system the root holds system/,
# so system files are system/system/...  Deletes are optional = true so re-applying is a no-op.

# ---------------------------------------------------------------- fstab (second-stage copies)
[[fstab]]
files = ["vendor/etc/fstab.mt6768", "vendor/etc/fstab.mt6769t"]
mount_points = ["/system", "/system_ext", "/vendor", "/product", "/odm"]
remove_flags = ["avb", "avb=*", "avb_keys=*"]

[[fstab]]
files = ["vendor/etc/fstab.mt6768", "vendor/etc/fstab.mt6769t"]
mount_points = ["/data"]
remove_flags = ["fileencryption=*", "keydirectory=*", "metadata_encryption=*"]
remove_mount_options = ["inlinecrypt"]

# ---------------------------------------------------------------- props (examples, disabled)
# [[props]]
# file = "system/system/build.prop"
# set = { "ro.adb.secure" = "0" }
#
# [[props]]
# file = "vendor/build.prop"
# set = { "ro.vendor.example" = "1" }

# ---------------------------------------------------------------- debloat: product (Google)
# kept on purpose: GmsCore, Phonesky, TrichromeLibrary (Chrome/WebView), Chrome,
# AndroidSystemIntelligence, PrivateComputeServices, Messages (Google Messages is the SMS app)
[[files]]
action = "delete"
path = "product/priv-app/Velvet"          # Google app / Assistant, 247 MiB
optional = true

[[files]]
action = "delete"
path = "product/app/Gmail2"               # 150 MiB
optional = true

[[files]]
action = "delete"
path = "product/app/Maps"                 # 140 MiB
optional = true

[[files]]
action = "delete"
path = "product/app/YouTube"              # 115 MiB
optional = true

